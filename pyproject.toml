[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kev"
version = "0.1.0"
description = "Laptop-scale reconstruction of a Jev-style decision model with a TypeSafe-compatible /v1/systemone API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jared Palmer" }]
requires-python = ">=3.12,<3.14"
keywords = ["decision-model", "calibration", "lora", "typesafe", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=3.0",
    "filelock>=3.13",   # the study lock; already a torch dependency, declared because kev.experiment imports it
    "numpy>=2.5.3",
    "peft>=0.21",
    "pydantic>=2.9",
    "scikit-learn>=1.9.1",
    "torch>=2.6,<2.9",
    "transformers>=5.17,<6",
]

[project.urls]
Repository = "https://github.com/jaredpalmer/kev"
Issues = "https://github.com/jaredpalmer/kev/issues"
"Model cards" = "https://github.com/jaredpalmer/kev/tree/main/docs/model-cards"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "typesafe-sdk>=0.6.0",
    "uvicorn>=0.30",
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",   # the Apple Silicon backend (kev.mlx_model); a no-op elsewhere
]
mlx = [
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.9",
    "modal==1.5.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["server: needs a running kev.serve instance (KEV_BASE_URL)"]

[tool.setuptools]
packages = ["kev"]

# Windows torch comes from the CUDA index: the PyPI win_amd64 wheel is the CPU build, so `uv sync` alone leaves
# torch.cuda.is_available() False. Linux keeps resolving torch from PyPI, where the wheel is already the CUDA build
# (modal_app.py builds its image from this pyproject + uv.lock), which is what the marker below protects; `explicit`
# keeps every other package off this index. cu126 is a floor, not a ceiling: it is the oldest CUDA here that still
# ships sm_75 (Turing) kernels, and it predates Blackwell, so an sm_120 card needs cu128. The wheels resolve to
# download-r2.pytorch.org rather than the index host; that is PyTorch's own R2 mirror and every hash is pinned.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
